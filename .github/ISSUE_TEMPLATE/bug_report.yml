name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Everything exit 3?** Check which refusal you got — `--dump-html`
          writes exactly what the parser saw. A ~5 KB "Sorry, you have been
          blocked" is Cloudflare's WAF, and the usual cause is a
          `HeadlessChrome` User-Agent or the address's recent volume. A
          ~28 KB "Just a moment…" is the managed challenge, which was
          measured clearing on the next attempt in a fresh context — that is
          what `--retries` does. On a long archive walk, raise `--delay` or
          use `--proxy-file`.
        - **`reading_time_min`, `word_count`, `language` null on every row?**
          Expected on a TAG FEED: its payload does not carry them. A day
          archive, an author page or a story does. The `data_source` column
          says which view built each row.
        - **`--pages 3` on a tag feed gave one page of stories?** Only the
          day archive has per-page addresses; `?page=2` on a tag feed is
          ignored by Medium. Use `/tag/{slug}/archive/{yyyy}/{mm}/{dd}`.
        - **A publication URL refused?** On purpose: a publication home page
          carries post ids and no post data. The error names the alternative.
          See [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is a
        challenge page, 4 is "ran fine, found nothing", 124 is a self-imposed
        timeout. The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --url "https://medium.com/tag/python/archive/2026/09/10" \
          --pages 3 --out python_days
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        Up to 128 stories per day, as the README says a day archive yields.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true

name: Site changed / selectors broke
description: Medium changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth
        its own report because the fix is different from a code bug:
        something on medium.com moved.

        Useful to know before filing, because it narrows the fix a lot — this
        parser reads **two different sources**, and they break differently:

        - **The inline GraphQL payload**, pushed into the served HTML as
          `window.ansFrontendGlobals.data.inlineQueryResults…push("{…}")`. It
          carries the numeric ids, the full answer text, `numUpvotes`,
          `numViews` and the creation time. A question page and a profile
          have it; a topic feed does not.
        - **The rendered cards**, anchored on Medium's own hooks:
          `a.answer_timestamp`, `.puppeteer_test_question_title`,
          `.spacing_log_answer_content`, `.spacing_log_answer_header`.

        If the PAYLOAD moves, a run does not fail — it quietly degrades to
        the cards and every count comes out null while the row count and the
        titles stay healthy. The `data_source` column is what shows it: rows
        that used to read `dom+inline` now read `dom`. If a CARD hook moves,
        the run reports 0 rows and exit 4, which is loud.

        So please include the `data_source` breakdown of your run — it is the
        single most useful line in the report.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - No rows at all on a page that visibly has answers (a card hook moved)
        - Rows come out, but every data_source is "dom" (the payload moved)
        - title is null, or wrong, on rows that clearly name a question
        - author empty on every row (the named profile link moved)
        - Scrolling no longer extends the feed at all
        - A language host stopped being recognised
        - A Space or Medium Session permalink is no longer read as an answer
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: >-
        The exact URL, its locale prefix, and how the browser was reached.
        Please say whether the run was headful or over --cdp-endpoint: a
        headless run is refused by the site and is not a parser problem.
      placeholder: "https://medium.com/topic/Machine-Learning (mode: topic, headful bundled Chromium, exit: DE datacentre)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description, and
        `--dump-html` writes one on success as well as on failure.

        - The payload as the page actually serves it:
          `python3 -c "import json,re;h=open('dump.html').read();d=json.loads(re.search(r'id=.__NEXT_DATA__.[^>]*>(.*?)</script>',h,1).group(1));print(sorted(d['props']['pageProps']))"`
        - For a price problem: one whole `article.c-lot-card__container` from
          devtools, and the amount the page shows for that lot.
        - For a `bid_kind` problem: the exact label the card prints
          ("Current bid", "Aktuelles Gebot", ...) and the locale.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces in a
        second locale, and when it last worked.
